name: Project board automation

# Moves issue cards on the "Music Repertoire" project board based on generic git/PR lifecycle
# events. Backlog and Ready are manual (human triage). See docs/orchestration.md for the
# integration contract a future multi-agent orchestrator must follow.
#
# Status option IDs (see .github/scripts/move-project-card.js for how to regenerate):
#   Backlog=94fc0f10 Ready=3811bc38 In Progress=2f9b4144 Review=c90f0020 CI=bbf5aa2b Done=ca9487ed

on:
  push:
    branches: ["feature/issue-*", "fix/issue-*"]
  pull_request:
    types: [opened, reopened, closed]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  in-progress:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        env:
          BRANCH: ${{ github.ref_name }}
          BODY: ""
          STATUS_OPTION_ID: "2f9b4144"
        with:
          github-token: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}
          script: |
            const move = require('./.github/scripts/move-project-card.js')
            await move({ github, context, core })

  review:
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          BODY: ${{ github.event.pull_request.body }}
          STATUS_OPTION_ID: "c90f0020"
        with:
          github-token: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}
          script: |
            const move = require('./.github/scripts/move-project-card.js')
            await move({ github, context, core })

  ci-passed:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch PR body
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}
          script: |
            const pr = context.payload.workflow_run.pull_requests[0]
            if (!pr) { core.setOutput('branch', ''); core.setOutput('body', ''); return }
            const { data } = await github.rest.pulls.get({ ...context.repo, pull_number: pr.number })
            core.setOutput('branch', data.head.ref)
            core.setOutput('body', data.body || '')
      - uses: actions/github-script@v7
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
          BODY: ${{ steps.pr.outputs.body }}
          STATUS_OPTION_ID: "bbf5aa2b"
        with:
          github-token: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}
          script: |
            const move = require('./.github/scripts/move-project-card.js')
            await move({ github, context, core })

  done:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          BODY: ${{ github.event.pull_request.body }}
          STATUS_OPTION_ID: "ca9487ed"
        with:
          github-token: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}
          script: |
            const move = require('./.github/scripts/move-project-card.js')
            await move({ github, context, core })
