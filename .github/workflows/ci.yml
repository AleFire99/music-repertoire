name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: repertoire
          POSTGRES_PASSWORD: repertoire
          POSTGRES_DB: repertoire
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U repertoire"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://repertoire:repertoire@localhost:5432/repertoire
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.7"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy src
      - name: Create test database
        run: PGPASSWORD=repertoire psql -h localhost -U repertoire -d repertoire -c "CREATE DATABASE repertoire_test;"
      - run: uv run alembic upgrade head
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
