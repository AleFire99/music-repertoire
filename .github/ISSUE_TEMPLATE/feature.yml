name: Feature
description: A new capability or user-facing behavior
labels: ["feature"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should this do, and why?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know this is done?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
