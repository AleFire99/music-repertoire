<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    Lucide-style icon set, hand-copied (not the npm package). 24x24 grid.
    Consumed via Icon.svelte's <use href="/icons.svg#{name}">; color comes
    from the consumer's CSS `color`, never hardcoded here.
  -->

  <symbol id="brand" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M9 18V5l12-2v13"/>
      <circle cx="6" cy="18" r="3"/>
      <circle cx="18" cy="16" r="3"/>
    </g>
  </symbol>

  <symbol id="focus" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
      <circle cx="12" cy="12" r="9"/>
      <circle cx="12" cy="12" r="5"/>
      <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>
    </g>
  </symbol>

  <symbol id="sessions" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
      <circle cx="12" cy="13" r="8"/>
      <path d="M12 9.5V13l2.5 1.5M9 2h6"/>
    </g>
  </symbol>

  <symbol id="stats" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
      <path d="M3 21h18M7 21V11M12 21V5M17 21v-7"/>
    </g>
  </symbol>

  <symbol id="pieces" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
    </g>
  </symbol>

  <symbol id="sheet" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/>
      <path d="M14 2v5h6"/>
      <circle cx="10" cy="17" r="2"/>
      <path d="M12 17v-5l3 1"/>
    </g>
  </symbol>

  <symbol id="list" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
      <path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>
    </g>
  </symbol>

  <symbol id="star" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" d="m12 3.6 2.6 5.3 5.9.86-4.25 4.14 1 5.86L12 17l-5.25 2.76 1-5.86L3.5 9.76l5.9-.86z"/>
  </symbol>

  <symbol id="star-filled" viewBox="0 0 24 24">
    <path fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round" d="m12 3.6 2.6 5.3 5.9.86-4.25 4.14 1 5.86L12 17l-5.25 2.76 1-5.86L3.5 9.76l5.9-.86z"/>
  </symbol>

  <symbol id="play" viewBox="0 0 24 24">
    <path fill="currentColor" d="M8 5.5v13l11-6.5z"/>
  </symbol>

  <symbol id="search" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
