    </g>
  </symbol>

  <symbol id="theme-moon" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/>
  </symbol>

  <symbol id="goal" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.9">
