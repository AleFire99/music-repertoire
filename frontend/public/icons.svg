    </g>
  </symbol>

  <symbol id="theme-moon" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/>
  </symbol>

  <symbol id="goal" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.9">
      <circle cx="12" cy="12" r="9"/>
      <circle cx="12" cy="12" r="3.4"/>
    </g>
  </symbol>

  <symbol id="streak" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
  </symbol>

  <symbol id="clock" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <circle cx="12" cy="12" r="9"/>
      <path d="M12 8v4l3 2"/>
    </g>
  </symbol>

  <symbol id="view-table" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="16" rx="1.5"/>
      <path d="M3 10h18M9 4v16"/>
    </g>
  </symbol>

  <symbol id="view-grid" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
      <rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.2"/>
      <rect x="13" y="3.5" width="7.5" height="7.5" rx="1.2"/>
      <rect x="3.5" y="13" width="7.5" height="7.5" rx="1.2"/>
      <rect x="13" y="13" width="7.5" height="7.5" rx="1.2"/>
    </g>
  </symbol>

  <symbol id="link" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1.5 1.5"/>
      <path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1.5-1.5"/>
    </g>
  </symbol>

  <symbol id="book" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5.5 3H19a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2V4.5A1.5 1.5 0 0 1 5.5 3Z"/>
