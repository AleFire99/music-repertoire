  </symbol>

  <symbol id="disclose" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="m9 5 7 7-7 7"/>
  </symbol>

  <symbol id="sidebar-toggle" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4.5" width="18" height="15" rx="2.5"/>
      <path d="M9.5 4.5v15"/>
      <path d="M5.8 9.5l-1.6 2.5 1.6 2.5"/>
    </g>
  </symbol>

  <symbol id="theme-sun" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
      <circle cx="12" cy="12" r="4"/>
