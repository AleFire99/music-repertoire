<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    Minimal Monochrome Editorial icon set — "engraver's / proofing marks".
    20x20 grid, 1.5px stroke, no fill, square corners. Consumed via
    Icon.svelte's <use href="/icons.svg#{name}">; color comes from the
    consumer's CSS `color`, never hardcoded here.
  -->
  <symbol id="piece" viewBox="0 0 20 20">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M10 4 3 5v10l7 1V4Z"/>
      <path d="M10 4l7 1v10l-7 1V4Z"/>
      <path d="M5.5 8h3M5.5 11h3M11.5 8h3M11.5 11h3"/>
    </g>
  </symbol>

  <symbol id="focus" viewBox="0 0 20 20">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M3 7V3h4"/>
      <path d="M13 3h4v4"/>
      <path d="M17 13v4h-4"/>
      <path d="M7 17H3v-4"/>
    </g>
  </symbol>

  <symbol id="session" viewBox="0 0 20 20">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M4 17h12"/>
      <path d="M6.5 17 8.5 4h3l2 13Z"/>
      <path d="M9.5 8 13 15.5"/>
      <circle cx="13" cy="15.5" r="0.9"/>
    </g>
  </symbol>

  <symbol id="stats" viewBox="0 0 20 20">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M4 12v4M8 6v10M12 9v7M16 4v13"/>
    </g>
  </symbol>

  <symbol id="resource" viewBox="0 0 20 20">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M4 2h9l4 4v12H4Z"/>
      <path d="M13 2v4h4"/>
    </g>
  </symbol>

  <symbol id="list" viewBox="0 0 20 20">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter">
      <rect x="3" y="4.5" width="3" height="3"/>
      <rect x="3" y="8.5" width="3" height="3"/>
      <rect x="3" y="12.5" width="3" height="3"/>
      <path d="M8.5 6h8M8.5 10h8M8.5 14h8"/>
    </g>
  </symbol>

  <symbol id="bookmark" viewBox="0 0 20 20">
    <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" d="M6 2h8v16l-4-3.5L6 18Z"/>
  </symbol>

  <symbol id="bookmark-filled" viewBox="0 0 20 20">
    <path fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="miter" d="M6 2h8v16l-4-3.5L6 18Z"/>
  </symbol>

  <symbol id="edit" viewBox="0 0 20 20">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M3 17l1.5-3.5 9-9 2 2-9 9L3 17Z"/>
      <path d="M11 6l2 2"/>
    </g>
  </symbol>

  <symbol id="delete" viewBox="0 0 20 20">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M3 8c2-1.5 3.5-1.5 5.5 0s3.5 1.5 5.5 0 3.5-1.5 3-1.5"/>
      <path d="M3 12.5c2-1.5 3.5-1.5 5.5 0s3.5 1.5 5.5 0 3.5-1.5 3-1.5"/>
    </g>
  </symbol>

  <symbol id="add" viewBox="0 0 20 20">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square">
      <path d="M10 4v12M4 10h12"/>
    </g>
  </symbol>

  <symbol id="close" viewBox="0 0 20 20">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square">
      <path d="M5 5l10 10M15 5 5 15"/>
    </g>
  </symbol>

  <symbol id="disclose" viewBox="0 0 20 20">
    <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" d="M7 5l7 5-7 5Z"/>
  </symbol>

  <symbol id="rail" viewBox="0 0 20 20">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M8 4H5v12h3"/>
      <path d="M12 4h3v12h-3"/>
    </g>
  </symbol>
</svg>
