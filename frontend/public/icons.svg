  <symbol id="clock" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <circle cx="12" cy="12" r="9"/>
      <path d="M12 8v4l3 2"/>
    </g>
